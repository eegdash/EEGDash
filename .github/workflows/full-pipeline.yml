# Daily ingestion pipeline: Fetch -> Clone/Digest -> Inject (to production)
#
# This is the single scheduled driver for the ingestion pipeline. It chains the
# three reusable workflows with `needs:` (robust) instead of `workflow_run`
# (fragile). It calls `fetch-source.yml` directly because the per-source
# `1-fetch-*.yml` wrappers do NOT expose a `workflow_call` trigger and therefore
# cannot be used as reusable workflows.
#
# NEMAR-ONLY consumption: data is ingested exclusively from NEMAR
# (data.nemar.org), which hosts native `nm*` datasets plus `on*` mirrors of
# OpenNeuro datasets. When a dataset exists both on OpenNeuro (`ds*`) and on
# NEMAR (`on*` with the same number), the NEMAR copy is preferred: after a
# successful injection the OpenNeuro twin is retired by retire-mirrors.
#
# Schedule  -> targets production `eegdash`, performs a REAL write, recomputes stats.
# Manual    -> defaults to `eegdash_staging` + dry-run so a hand-triggered run is safe.
name: "Daily Ingestion Pipeline"

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      database:
        description: 'Target database for injection'
        required: true
        default: 'eegdash_staging'
        type: choice
        options:
          - eegdash_staging
          - eegdash
          - eegdash_v1
      dry_run:
        description: 'Dry run injection (validate only, no upload)'
        required: false
        default: true
        type: boolean
      max_datasets:
        description: 'Max datasets to process (0 = all)'
        required: false
        default: '0'
        type: string

# Avoid overlapping ingestion runs writing to the same database concurrently.
concurrency:
  group: ingestion-pipeline
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Step 1: Fetch NEMAR (calls fetch-source.yml directly; the 1-fetch-*.yml
  #         wrappers lack a workflow_call trigger and cannot be reused)
  # ============================================================================
  fetch-nemar:
    uses: ./.github/workflows/fetch-source.yml
    with:
      source_name: "NEMAR"
      script_path: "scripts/ingestions/1_fetch_sources/nemar.py"
      output_file: "nemar_datasets.json"
      script_args: "--base-url https://data.nemar.org --id-prefixes nm,on"
    secrets:
      DATASET_LISTINGS_TOKEN: ${{ secrets.DATASET_LISTINGS_TOKEN }}

  # ============================================================================
  # Step 2: Clone & Digest (runs only if the fetch succeeded)
  # ============================================================================
  digest-nemar:
    needs: [fetch-nemar]
    if: ${{ always() && needs.fetch-nemar.result == 'success' }}
    uses: ./.github/workflows/2-clone-digest.yml
    with:
      source_name: "NEMAR"
      consolidated_file: "nemar_datasets.json"
      max_datasets: ${{ fromJSON(github.event.inputs.max_datasets || '0') }}
      # Large NEMAR re-hosts (nm000281 >100k files) exceed the 120 s default.
      dataset_timeout: 900
    secrets:
      DATASET_LISTINGS_TOKEN: ${{ secrets.DATASET_LISTINGS_TOKEN }}

  # ============================================================================
  # Step 3: Inject to MongoDB (after the digest settles)
  #   schedule -> database=eegdash (prod), dry_run=false  (real write + stats)
  #   manual   -> database=<input>,        dry_run=<input> (default staging+dry)
  #   The `--sources nemar` filter keeps digests left by other sources in the
  #   shared listings directory out of validation and the quality gate.
  # ============================================================================
  inject:
    needs: [digest-nemar]
    if: always()
    uses: ./.github/workflows/3-inject.yml
    with:
      source_name: "NEMAR"
      database: ${{ github.event.inputs.database || 'eegdash' }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      sources: "nemar"
    secrets:
      DATASET_LISTINGS_TOKEN: ${{ secrets.DATASET_LISTINGS_TOKEN }}
      EEGDASH_ADMIN_TOKEN: ${{ secrets.EEGDASH_API_TOKEN }}

  # ============================================================================
  # Step 4: Retire OpenNeuro mirrors. A dataset present on OpenNeuro as dsNNNNNN
  #   and on NEMAR as onNNNNNN is served from NEMAR; the ds* twin is deleted.
  #   Only runs after a real (non-dry-run) injection.
  # ============================================================================
  retire-mirrors:
    needs: [inject]
    if: ${{ always() && needs.inject.result == 'success' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EEGDash
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}
          path: eegdash

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd eegdash
          python -m pip install --upgrade pip
          pip install httpx

      - name: Retire OpenNeuro twins of NEMAR on* datasets
        env:
          EEGDASH_ADMIN_TOKEN: ${{ secrets.EEGDASH_API_TOKEN }}
        run: |
          # Stream the output: retirement walks every twin doing network deletes
          # with rate-limit backoff, so capturing into a variable would leave the
          # log empty until it finished -- the same blind spot 3-inject.yml fixes.
          set +e
          python eegdash/scripts/ingestions/prefer_nemar_mirrors.py \
            --database "${{ github.event.inputs.database || 'eegdash' }}" \
            --apply 2>&1 | tee /tmp/retire_output.log
          RC=${PIPESTATUS[0]}
          set -e
          exit $RC

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Pipeline Summary
    needs: [fetch-nemar, digest-nemar, inject, retire-mirrors]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          {
            echo "## Daily Ingestion Pipeline Summary (NEMAR-only)"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Database: \`${{ github.event.inputs.database || 'eegdash' }}\`"
            echo "- Dry run: \`${{ github.event.inputs.dry_run || 'false' }}\`"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Fetch NEMAR | ${{ needs.fetch-nemar.result }} |"
            echo "| Digest NEMAR | ${{ needs.digest-nemar.result }} |"
            echo "| Inject | ${{ needs.inject.result }} |"
            echo "| Retire OpenNeuro mirrors | ${{ needs.retire-mirrors.result }} |"
            echo ""
            echo "- Datasets injected: ${{ needs.inject.outputs.datasets_injected || 'N/A' }}"
            echo "- Records injected: ${{ needs.inject.outputs.records_injected || 'N/A' }}"
          } >> "$GITHUB_STEP_SUMMARY"
